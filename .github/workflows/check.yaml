name: Check

# The flake's checks: the manifests the modules send to the cluster, validated without a cluster, and dead Nix code
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Nix
      uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      with:
        extra_nix_config: experimental-features = nix-command flakes
    - name: Check the flake
      run: nix flake check -L
